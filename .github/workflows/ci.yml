# CI: generated files, types, unit tests, the real core headless, and the
# window self-test on all three desktops (design: /design/testing/, §12.6).
# The docs site (website/) is deployed separately and not built here.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Generated files, types, unit and headless tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4   # pinned: bun:ffi and Worker are experimental
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install Mesa (software Vulkan for offscreen captures)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: bun install --frozen-lockfile
      - name: Generated protocol bindings and fixtures are up to date
        run: bun run gen:check
      - run: bun run typecheck
      - run: bun run test
      - name: Rust tests (tree, fixtures, random batches, incremental-vs-scratch layout)
        run: cargo test --release --manifest-path core/Cargo.toml -p mantou-tree -p mantou-text -p mantou-image
      - name: Build the native core
        run: cargo build --release --manifest-path core/Cargo.toml
      - name: The core's own unit tests (dialogs, HTML documents)
        run: cargo test --release --manifest-path core/Cargo.toml -p mantou-ffi -p mantou-html --lib
      - name: Headless tests on the real core
        run: bun run test:headless
      - name: Reference images that didn't match (actual and diff)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-failures-${{ runner.os }}
          path: tests/images/__failures__
          if-no-files-found: ignore
      - name: Reference images that didn't match (actual and diff)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-failures-linux-checks
          path: tests/images/__failures__
          if-no-files-found: ignore

  selftest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (X11, Mesa lavapipe)
            os: ubuntu-24.04
          - name: macOS aarch64 (Metal)
            os: macos-15
          - name: Windows x86_64 (D3D12, WARP)
            os: windows-2022
    name: Window self-test · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: (Linux) Install Xvfb, Mesa Vulkan and winit's X11 libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libegl1 \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2
      - run: bun install --frozen-lockfile
      - name: Build the native core
        run: cargo build --release --manifest-path core/Cargo.toml
      - name: Headless tests on the real core
        run: bun run test:headless
      - name: Self-test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" bun run selftest
      - name: Self-test
        if: runner.os != 'Linux'
        run: bun run selftest
      - name: mantou dev reloads (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" bun spike/devtest.ts
      - name: mantou dev reloads
        if: runner.os != 'Linux'
        run: bun spike/devtest.ts
      - name: (Windows) Package, install, run and uninstall the counter
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          bun scripts/package-smoke-windows.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-report-${{ matrix.os }}
          path: selftest-report.json
          if-no-files-found: warn
