# M0 spike: the threading model on all three desktops (DESIGN.md §13 M0, §12.5).
# Builds the native core, then runs spike/selftest.ts in a real window.
name: m0-spike

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 (X11, Mesa lavapipe)
            os: ubuntu-24.04
          - name: macOS aarch64 (Metal)
            os: macos-14
          - name: Windows x86_64 (D3D12, WARP)
            os: windows-2022
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4   # pinned: bun:ffi and Worker are experimental (DESIGN.md §11)

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: (Linux) Install Xvfb, Mesa Vulkan and winit's X11 libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libegl1 \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2

      - name: Type-check
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: Build the native core
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Self-test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" bun run selftest

      - name: Self-test
        if: runner.os != 'Linux'
        run: bun run selftest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-report-${{ matrix.os }}
          path: m0-report.json
          if-no-files-found: warn
