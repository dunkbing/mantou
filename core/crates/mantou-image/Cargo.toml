[package]
name = "mantou-image"
description = "Mantou's images: PNG, JPEG and WebP decoding, and SVG rasterized at the size drawn. No platform dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.49", default-features = false }
