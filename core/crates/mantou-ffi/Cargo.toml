[package]
name = "mantou-ffi"
description = "Mantou native core: the C ABI loaded by Bun through bun:ffi."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
winit = "0.30.13"
wgpu = "30"
pollster = "1"
# The system clipboard for the window (headless instances keep their own).
arboard = { version = "3", default-features = false }
mantou-tree = { path = "../mantou-tree" }
mantou-render = { path = "../mantou-render" }

# Platform services (design §10): file dialogs and message boxes everywhere, the app and context menus natively.
serde_json = "1"
accesskit = "0.25"
accesskit_winit = "0.34"
rfd = "0.17"
# Desktop notifications.
notify-rust = "4"
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
# The tray icon and the dock badge.
tray-icon = "0.26"
mantou-image = { path = "../mantou-image" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
