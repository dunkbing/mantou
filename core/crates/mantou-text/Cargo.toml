[package]
name = "mantou-text"
description = "Mantou's text: parley layout, swash rasterization, a glyph atlas, and the bundled Inter font. No platform dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
parley = "0.12"
rustc-hash = "2"
swash = "0.2.10"
# Load fontconfig at run time on Linux instead of linking it: no -dev package
# to build, and machines without it still start (with only the bundled font).
fontique = { version = "0.12", features = ["fontconfig-dlopen"] }
